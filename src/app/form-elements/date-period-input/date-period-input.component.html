<form
  class="filter-form"
  [formGroup]="form"
>
  <div class="date-row">
    <app-date-picker
      formControlName="startDate"
      label="TK_DATE_FROM"
    ></app-date-picker>
    <app-date-picker
      formControlName="endDate"
      label="TK_DATE_TO"
    ></app-date-picker>
    @if (form.invalid) {
      <div class="date-row__warning" (click)="showValidationError($event)">
        <ion-icon src="assets/icon/warning-sign.svg"></ion-icon>
      </div>
    }
  </div>
</form>

@if (!hideControls) {
  <div class="controls">
    <ion-button
      fill="clear"
      (click)="shiftDates(-1)"
      [disabled]="!form.valid"
    ><ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon></ion-button>
    <div class="chips">
      <ion-chip
        [color]="selectedPeriod === 'week' ? 'primary' : 'medium'"
        (click)="selectPeriod('week')"
      >{{ 'TK_WEEK' | translate }}</ion-chip>
      <ion-chip
        [color]="selectedPeriod === 'month' ? 'primary' : 'medium'"
        (click)="selectPeriod('month')"
      >{{ 'TK_MONTH' | translate }}</ion-chip>
    </div>
    <ion-button
      fill="clear"
      (click)="shiftDates(1)"
      [disabled]="!form.valid"
    ><ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon></ion-button>
  </div>
}
