<ion-modal class="selection-modal" [isOpen]="isOpen" (didDismiss)="dismissed.emit()" [breakpoints]="[0, 1]" [initialBreakpoint]="1">
  <ng-template>
    <ion-content>
      <ion-item>
        <ion-input [placeholder]="placeholder | translate" [value]="searchValue" (ionInput)="onSearch($event)">
          <ion-icon slot="start" name="search-outline" style="color: var(--ion-color-medium)"></ion-icon>
        </ion-input>
      </ion-item>
      <ion-list lines="full">
        @for (item of items; track item.id) {
          <ion-item button detail="false" (click)="selected.emit(item)">
            <ion-label>
              <h2>{{ item.title }}</h2>
              @if (item.subtitle) {
                <p>{{ item.subtitle }}</p>
              }
            </ion-label>
          </ion-item>
        } @empty {
          <ion-item lines="none">
            <ion-label class="ion-text-center">{{ emptyText | translate }}</ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-content>

    <!-- Pinned so the shortcuts stay reachable however long the list is. -->
    @if (createOptions.length) {
      <ion-footer class="ss-create-bar">
        @for (option of createOptions; track option.type) {
          <button type="button" class="ss-create" (click)="createRequested.emit(option)">
            <ion-icon name="add-outline"></ion-icon>
            <span>{{ option.label | translate }}</span>
          </button>
        }
      </ion-footer>
    }
  </ng-template>
</ion-modal>
