<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_NEW_RULE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <app-rule-form #addFormRef></app-rule-form>
</ion-content>

<ion-footer>
  <div class="nf-actionbar">
    <button
      type="button"
      class="nf-submit"
      (click)="addRule()"
    >
      <span class="nf-submit-plus">+</span>
      {{ 'TK_ADD' | translate }}
    </button>
  </div>
</ion-footer>
