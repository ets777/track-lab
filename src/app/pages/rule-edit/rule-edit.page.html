<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_EDIT_RULE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (rule) {
    <app-rule-form
      #editFormRef
      [rule]="rule"
    ></app-rule-form>
  }
</ion-content>

@if (rule) {
  <ion-footer>
    <div class="nf-actionbar">
      <button
        type="button"
        class="nf-submit"
        (click)="saveRule()"
      >
        {{ 'TK_SAVE' | translate }}
      </button>
    </div>
  </ion-footer>
}
