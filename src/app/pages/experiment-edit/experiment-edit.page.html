<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_EDIT_EXPERIMENT' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (experiment) {
    <app-experiment-form
      #editFormRef
      [experiment]="experiment"
      [initialEntries]="initialEntries"
      [initialRuleIds]="initialRuleIds"
    ></app-experiment-form>
  }
</ion-content>

@if (experiment) {
  <ion-footer>
    <div class="nf-actionbar">
      <button
        type="button"
        class="nf-submit"
        (click)="saveExperiment()"
      >
        {{ 'TK_SAVE' | translate }}
      </button>
    </div>
  </ion-footer>
}
