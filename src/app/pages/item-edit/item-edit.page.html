<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_EDIT_ITEM' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (item) {
    <app-item-form
      #updateFormRef
      [item]="item"
      [listId]="item.listId"
    ></app-item-form>
  }
</ion-content>

<ion-footer>
  <div class="nf-actionbar">
    <button
      type="button"
      class="nf-submit"
      (click)="save()"
    >
      {{ 'TK_SAVE' | translate }}
    </button>
  </div>
</ion-footer>
