<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="lab-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'TK_METRICS' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-fab vertical="bottom" horizontal="end" (click)="goToAddPage()">
    <ion-fab-button>
      <ion-icon src="assets/icon/plus.svg"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  @if (isLoading) {
    <app-default-skeleton [showIcon]="false" [lines]="1"></app-default-skeleton>
  } @else {
    <div class="lib-card">
      <ion-item lines="full" class="lib-search">
        <ion-icon name="search-outline" slot="start" color="medium"></ion-icon>
        <ion-input [(ngModel)]="searchQuery" [placeholder]="'TK_SEARCH' | translate"></ion-input>
      </ion-item>
      <ion-list lines="full">
        @for (metric of filteredMetrics; track metric.id) {
          <ion-item (click)="goToViewPage(metric.id)" button>
            <ion-label>
              <div class="lib-name">{{ metric.name | translate }}</div>
            </ion-label>
            <ion-buttons slot="end">
              <ion-button id="open-action-sheet-metric-{{metric.id}}" (click)="$event.stopPropagation()">
                <ion-icon src="assets/icon/three-dots-vertical.svg"></ion-icon>
              </ion-button>
            </ion-buttons>
            <ion-action-sheet
              trigger="open-action-sheet-metric-{{metric.id}}"
              header="{{ 'TK_ACTIONS' | translate }}"
              [buttons]="getMetricActionSheetButtons(metric)"
              (didDismiss)="doMetricAction($event, metric.id)"
            ></ion-action-sheet>
          </ion-item>
        } @empty {
          <ion-text style="display: block; padding: 16px">{{ 'TK_THERE_ARE_NO_METRICS' | translate }}</ion-text>
        }
      </ion-list>
    </div>
  }
</ion-content>
