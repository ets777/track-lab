<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ list?.name | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openListMenu()">
        <ion-icon src="assets/icon/three-dots-vertical.svg"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-fab vertical="bottom" horizontal="end" (click)="goToAddItem()">
    <ion-fab-button>
      <ion-icon src="assets/icon/plus.svg"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  @if (items === null) {
    <app-default-skeleton [showIcon]="false" [lines]="1"></app-default-skeleton>
  } @else {
    <div class="lib-card">
      <ion-item lines="full" class="lib-search">
        <ion-icon name="search-outline" slot="start" color="medium"></ion-icon>
        <ion-input [(ngModel)]="searchQuery" [placeholder]="'TK_SEARCH' | translate"></ion-input>
      </ion-item>
      <ion-list lines="full">
        @for (item of filteredItems; track item.id) {
          <ion-item (click)="router.navigate(['/item', item.id])" button>
            <ion-label>
              <div class="lib-name">{{ item.name }}</div>
            </ion-label>
            <ion-buttons slot="end">
              <ion-button id="open-action-sheet-item-{{item.id}}" (click)="$event.stopPropagation()">
                <ion-icon src="assets/icon/three-dots-vertical.svg"></ion-icon>
              </ion-button>
            </ion-buttons>
            <ion-action-sheet
              trigger="open-action-sheet-item-{{item.id}}"
              [buttons]="itemActionSheetButtons"
              (didDismiss)="doItemActionFromSheet($event, item.id)"
            ></ion-action-sheet>
          </ion-item>
        } @empty {
          <ion-item>
            <ion-label>{{ 'TK_LIST_IS_EMPTY' | translate }}</ion-label>
          </ion-item>
        }
      </ion-list>
    </div>
  }
</ion-content>
