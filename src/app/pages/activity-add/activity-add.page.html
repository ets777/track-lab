<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_NEW_ACTIVITY' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-activity-form #addFormRef></app-activity-form>
</ion-content>

<ion-footer>
  <div class="nf-actionbar">
    <button
      type="button"
      class="nf-submit"
      [disabled]="!isFormValid()"
      (click)="addActivity()"
    >{{ 'TK_ADD_ACTIVITY' | translate }}</button>
  </div>
</ion-footer>
