<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (showBackButton) {
        <app-back-button></app-back-button>
      } @else {
        <ion-menu-button menu="lab-menu"></ion-menu-button>
      }
    </ion-buttons>
    <ion-title>{{ 'TK_EXPERIMENTS' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-fab vertical="bottom" horizontal="end" (click)="goToAddPage()">
    <ion-fab-button>
      <ion-icon src="assets/icon/plus.svg"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div class="xp-chips">
    @for (f of filters; track f.id) {
      <button
        class="xp-chip"
        [class.is-active]="activeFilter === f.id"
        (click)="activeFilter = f.id"
      >
        {{ f.labelKey | translate }}<span class="xp-chip-n">{{ getFilterCount(f.id) }}</span>
      </button>
    }
  </div>

  <div class="lib-card">
    <ion-item lines="full" class="lib-search">
      <ion-icon name="search-outline" slot="start" color="medium"></ion-icon>
      <ion-input [(ngModel)]="searchQuery" [placeholder]="'TK_SEARCH' | translate"></ion-input>
    </ion-item>
    <ion-list lines="full">
      @for (experiment of filteredExperiments; track experiment.id) {
        <ion-item
          (click)="goToViewPage(experiment.id)"
          button
          [attr.data-status]="getStatus(experiment)"
        >
          <ion-label>
            <div class="lib-name">{{ experiment.title }}</div>
          </ion-label>
          <ion-buttons slot="end">
            <ion-button id="open-action-sheet-experiment-{{experiment.id}}" (click)="$event.stopPropagation()">
              <ion-icon src="assets/icon/three-dots-vertical.svg"></ion-icon>
            </ion-button>
          </ion-buttons>
          <ion-action-sheet
            trigger="open-action-sheet-experiment-{{experiment.id}}"
            [buttons]="getActionSheetButtons(experiment)"
            (didDismiss)="doExperimentAction($event, experiment.id)"
          ></ion-action-sheet>
        </ion-item>
      } @empty {
        <ion-text style="display: block; padding: 34px 16px; text-align: center">{{ 'TK_NO_EXPERIMENTS' | translate }}</ion-text>
      }
    </ion-list>
  </div>
</ion-content>
