<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start" [showBack]="showBackButton" menu="stats-menu"></app-nav-button>
    <ion-title>{{ 'TK_ACHIEVEMENTS' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  @if (loading) {
    <app-default-skeleton></app-default-skeleton>
  } @else {
    <app-achievements-list [achievements]="achievements"></app-achievements-list>
  }
</ion-content>
