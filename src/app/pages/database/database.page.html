<ion-header>
  <ion-toolbar>
    <ion-title>Database</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-select
      [(ngModel)]="selectedTable"
      (ionChange)="onTableChange()"
      label="Table"
      interface="action-sheet"
    >
      @for (table of tables; track table) {
        <ion-select-option [value]="table">{{ table }}</ion-select-option>
      }
    </ion-select>
  </ion-item>

  @if (rows.length) {
    <div style="overflow-x: auto; margin-top: 16px;">
      <table>
        <thead>
          <tr>
            @for (col of columns; track col) {
              <th>{{ col }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of rows; track row.id) {
            <tr>
              @for (col of columns; track col) {
                <td>{{ row[col] }}</td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else if (selectedTable) {
    <p>No rows</p>
  }

  <ion-button color="danger" style="margin-top: 24px;" (click)="clearDatabase()">Clear database</ion-button>
</ion-content>
