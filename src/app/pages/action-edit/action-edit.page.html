<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_EDIT' | translate }}
      {{ 'TK_ACTION' | translate | lowercase }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (action) {
    <app-action-form
      #updateFormRef
      [action]="action"
    ></app-action-form>
  }
</ion-content>

@if (action) {
  <ion-footer>
    <div class="nf-actionbar">
      <button
        type="button"
        class="nf-submit"
        (click)="updateAction()"
      >
        {{ 'TK_SAVE' | translate }}
      </button>
    </div>
  </ion-footer>
}
