<ion-header>
  <ion-toolbar>
    <app-nav-button slot="start"></app-nav-button>
    <ion-title>{{ 'TK_TAGS' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-fab vertical="bottom" horizontal="end" (click)="goToAddPage()">
    <ion-fab-button>
      <ion-icon src="assets/icon/plus.svg"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  @if (isLoading) {
    <app-default-skeleton [showIcon]="false" [lines]="1"></app-default-skeleton>
  } @else {
    <div class="lib-card">
      <ion-item lines="full" class="lib-search">
        <ion-icon name="search-outline" slot="start" color="medium"></ion-icon>
        <ion-input [(ngModel)]="searchQuery" [placeholder]="'TK_SEARCH' | translate"></ion-input>
      </ion-item>
      <ion-list lines="full">
        @for (tag of filteredTags; track tag.id) {
          <ion-item (click)="goToViewPage(tag.id)" button>
            <ion-label>
              <div class="lib-name">{{ tag.name }}</div>
            </ion-label>
            <ion-buttons slot="end">
              <ion-button id="open-action-sheet-tag-{{tag.id}}" (click)="$event.stopPropagation()">
                <ion-icon src="assets/icon/three-dots-vertical.svg"></ion-icon>
              </ion-button>
            </ion-buttons>
            <ion-action-sheet
              trigger="open-action-sheet-tag-{{tag.id}}"
              [buttons]="tagActionSheetButtons"
              (didDismiss)="doTagAction($event, tag.id)"
            ></ion-action-sheet>
          </ion-item>
        }
      </ion-list>
    </div>
  }
</ion-content>
